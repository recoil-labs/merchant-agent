# The Merchant Agent: check, test, audit, build and smoke-test the image on
# every change; on a v* tag, also publish it to GHCR with an SBOM and a
# keyless cosign signature. Once a day and on demand, check that the shared
# vectors still match RecoilPay's (needs the RECOILPAY_REPO_TOKEN secret).
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merchant-agent-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/merchant-agent

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show # installs the toolchain rust-toolchain.toml pins
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  adapter:
    name: example adapter passes the conformance suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: examples/adapter/test.sh

  anvil:
    name: on-chain tests (anvil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # anvil only: the escrow's bytecode is in tests/fixtures.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked -p merchant-agent-core --test chain
        env:
          MERCHANT_AGENT_REQUIRE_ANVIL: '1'

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: Cargo.toml
          command: check

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned: this job runs in the same Actions cache scope as the builds.
      - run: cargo install --locked cargo-audit --version 0.23.0
      - run: cargo audit --deny warnings

  image:
    name: image + compose smoke test
    runs-on: ubuntu-latest
    needs: [check, deny, audit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cast, to make the throwaway operator's keys.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: merchant-agent:smoke
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Runs it with a sandbox config against the stub aggregator, waits for
      # healthy and /readyz, and runs `merchant-agent doctor` inside it.
      # (RECOILPAY_REPO=path/to/recoil-pay-v2 runs it against the real one.)
      - name: compose smoke test
        run: deploy/test/smoke.sh

  k8s:
    name: kubernetes smoke test (kind)
    runs-on: ubuntu-latest
    needs: [image]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cast, to make the throwaway operator's keys.
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
      - name: install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind
      - run: deploy/test/k8s-smoke.sh

  publish:
    name: publish to GHCR (tags only)
    runs-on: ubuntu-latest
    # Every check gates a release, not just some of them.
    needs: [check, adapter, anvil, deny, audit, image, k8s]
    # Only a pushed tag: a dispatch on an old tag could re-publish it.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # A protected environment: give it required reviewers in the repository
    # settings, so pushing a tag alone can't publish and sign an image.
    environment: release
    permissions:
      contents: write   # the SBOM on the release
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tagged commit is on main (reviewed and merged)
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD \
            || { echo "tag $GITHUB_REF_NAME points at a commit that is not on main"; exit 1; }
      - name: the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          [ "$tag" = "$crate" ] || { echo "tag $tag but Cargo.toml says $crate"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_COMMIT=${{ github.sha }}
          # No build cache: other jobs can write the Actions cache, so a
          # release is always built from source.
          no-cache: true
      - name: SBOM (syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: merchant-agent.spdx.json
          upload-release-assets: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign the image and attest its SBOM (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type spdxjson --predicate merchant-agent.spdx.json "$IMAGE@$DIGEST"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merchant-agent-sbom
          path: merchant-agent.spdx.json

  vectors:
    name: shared vectors match RecoilPay's
    runs-on: ubuntu-latest
    # A read-only token for recoil-labs/recoil-pay-v2 (contents: read). Forks
    # and merchants' copies don't have it, so the job skips there.
    env:
      RECOILPAY_REPO_TOKEN: ${{ secrets.RECOILPAY_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: no token, no check
        if: env.RECOILPAY_REPO_TOKEN == ''
        run: echo "::warning::RECOILPAY_REPO_TOKEN is not set; the vector check did not run"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RECOILPAY_REPO_TOKEN != ''
        with:
          repository: recoil-labs/recoil-pay-v2
          token: ${{ env.RECOILPAY_REPO_TOKEN }}
          path: recoil-pay-v2
          sparse-checkout: test-vectors
          persist-credentials: false
      - if: env.RECOILPAY_REPO_TOKEN != ''
        run: scripts/sync-from-monorepo.sh --check recoil-pay-v2
